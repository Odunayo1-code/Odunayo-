<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
    <link rel="stylesheet" href="style.css">
    <title>Product preview card</title>
</head>
<body>
    <div class="card">
        <div class="image-container">
            <img src="image-product-desktop.jpg"alt="Gabrielle Essence Perfume">
       </div>
        <div class="content">
            <p class="category">PERFUME</p>
            <h1>Gabrielle Essence Eau De Parfum</h2>
            <p class="description">A floral, solar and voluptuous interpretation composed by Olivier Polge, 
                Perfumer-Creator for the House of CHANEL.</p>
                <p class="price">
                    <span class="discounted">$149.99</span>
                    <span class="original">$169.99</span>
                </p>
                <button class="add-to-cart">Add to Cart</button>
        </div>
    </div>
    
</body>
<footer>
    <div class="attribution">
      Coded by <a href="https://github.com/Odunayo1-code/Odunayo-">Odunayo1-code/Odunayo-</a>.
    </div>
  </footer>
</html>
